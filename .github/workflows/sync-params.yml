name: Sincronizar parâmetros da OpenRouter

# Mantém as descrições dos parâmetros alinhadas com a spec OpenAPI oficial
# da OpenRouter, sem edição manual.
#
# Custo: ZERO. Este repositório é público, e o GitHub Actions em runners
# padrão (ubuntu-latest) é gratuito e sem limite de minutos para repos
# públicos — a cota de 2.000 min/mês vale apenas para repos privados.
#
# O job comita direto na main, e só quando a OpenRouter realmente mudou
# alguma coisa: o script compara ignorando o carimbo `geradoEm`, então
# execução sem novidade não gera commit.
#
# Por que não abre PR: criar PR a partir de um workflow exige marcar
# "Allow GitHub Actions to create and approve pull requests" em
# Settings → Actions → General. Com a caixa desmarcada (o padrão), o passo
# falha com "GitHub Actions is not permitted to create or approve pull
# requests" — foi o que derrubou as execuções de 27/07 e 03/08/2026.
# Commitar direto usa apenas `contents: write`, que o GITHUB_TOKEN já tem.
#
# Atenção: o GitHub desativa workflows agendados após 60 dias sem atividade
# no repositório (envia e-mail avisando). Basta reativar pela aba Actions.
on:
  schedule:
    - cron: '0 6 * * 1'   # toda segunda-feira, 06:00 UTC
  workflow_dispatch:       # permite rodar sob demanda pela aba Actions

permissions:
  contents: write

# Duas execuções gravando na main ao mesmo tempo derrubariam uma das duas
# no push. Enfileira em vez de correr o risco.
concurrency:
  group: sync-params
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # v5 nas actions: as v4 rodam em Node 20, desativado nos runners desde
      # 02/06/2026 e hoje forçado para Node 24 com aviso de depreciação.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Guarda a propriedade "só comita quando muda de verdade". Sem rede, e
      # tolerante a clone raso: os casos que dependem do histórico se auto-pulam.
      - name: Testar o comparador
        run: node scripts/sync-params.test.mjs

      - name: Sincronizar a partir da spec OpenAPI
        run: node scripts/sync-params.mjs

      - name: Comitar na main se algo mudou
        run: |
          set -euo pipefail

          if git diff --quiet -- index.html params.json; then
            echo "✓ Nada mudou na spec da OpenRouter — nenhum commit."
            echo "Nada mudou na spec da OpenRouter." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Mudanças detectadas:" >> "$GITHUB_STEP_SUMMARY"
          echo '```diff' >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- index.html params.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html params.json
          git commit -m 'chore: sincroniza parâmetros com a spec da OpenRouter'

          # A main pode ter andado entre o checkout e o push. Rebase e tenta
          # de novo antes de desistir, em vez de perder a sincronização.
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✓ Commit publicado na main."
              exit 0
            fi
            echo "Push falhou (tentativa $tentativa); rebaseando sobre a main…"
            git pull --rebase origin main
          done

          echo "✗ Não foi possível publicar na main após 3 tentativas." >&2
          exit 1
